name: Application quality

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_FILE: compose.yaml:compose.ci.yaml
  COMPOSE_ENV_FILE: compose.env.example

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      # Il commit del run deve essere quello verificato, anche per le pull request.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verificato il 2026-09-15
        with:
          ref: ${{ github.sha }}

      - name: Build backend Compose service
        run: docker compose --env-file "$COMPOSE_ENV_FILE" build backend

      - name: Install backend dependencies
        run: docker compose --env-file "$COMPOSE_ENV_FILE" run --rm --no-deps --entrypoint composer backend install --no-interaction --prefer-dist

      - name: Backend tests
        # PHPUnit deve isolare ambiente, broadcast e coda dal profilo realtime CI.
        run: docker compose --env-file "$COMPOSE_ENV_FILE" run --rm --no-deps -e APP_ENV=testing -e BROADCAST_CONNECTION=null -e QUEUE_CONNECTION=sync backend composer test

      - name: Backend style check
        run: docker compose --env-file "$COMPOSE_ENV_FILE" run --rm --no-deps backend ./vendor/bin/pint --test

      - name: Backend static analysis
        run: docker compose --env-file "$COMPOSE_ENV_FILE" run --rm --no-deps backend ./vendor/bin/phpstan analyse --memory-limit=512M

  frontend:
    runs-on: ubuntu-24.04
    steps:
      # Il commit del run deve essere quello verificato, anche per le pull request.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verificato il 2026-09-15
        with:
          ref: ${{ github.sha }}

      - name: Build frontend Compose service
        run: docker compose --env-file "$COMPOSE_ENV_FILE" build frontend

      - name: Frontend tests
        run: docker compose --env-file "$COMPOSE_ENV_FILE" run --rm --no-deps frontend pnpm test

      - name: Frontend lint
        run: docker compose --env-file "$COMPOSE_ENV_FILE" run --rm --no-deps frontend pnpm lint

      - name: Frontend typecheck
        run: docker compose --env-file "$COMPOSE_ENV_FILE" run --rm --no-deps frontend pnpm typecheck

      - name: Frontend build
        run: docker compose --env-file "$COMPOSE_ENV_FILE" run --rm --no-deps frontend pnpm build

  e2e:
    name: Realtime Compose E2E
    runs-on: ubuntu-24.04
    steps:
      # Il commit del run deve essere quello verificato, anche per le pull request.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verificato il 2026-09-15
        with:
          ref: ${{ github.sha }}

      - name: Generate ephemeral CI TLS
        env:
          CI_TLS_DIR: ${{ runner.temp }}/simple-chat-tls
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$CI_TLS_DIR"

          openssl genrsa -out "$CI_TLS_DIR/ca-key.pem" 2048
          openssl req -x509 -new -nodes \
            -key "$CI_TLS_DIR/ca-key.pem" \
            -sha256 -days 1 \
            -out "$CI_TLS_DIR/ca.pem" \
            -subj "/CN=Simple Chat CI Root CA" \
            -addext "basicConstraints=critical,CA:TRUE,pathlen:1" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"

          openssl genrsa -out "$CI_TLS_DIR/simple-chat.test-key.pem" 2048
          openssl req -new \
            -key "$CI_TLS_DIR/simple-chat.test-key.pem" \
            -out "$CI_TLS_DIR/simple-chat.test.csr" \
            -subj "/CN=app.simple-chat.test"
          printf '%s\n' \
            'basicConstraints=CA:FALSE' \
            'keyUsage=digitalSignature,keyEncipherment' \
            'extendedKeyUsage=serverAuth' \
            'subjectAltName=DNS:app.simple-chat.test,DNS:api.simple-chat.test' \
            > "$CI_TLS_DIR/san.cnf"
          openssl x509 -req \
            -in "$CI_TLS_DIR/simple-chat.test.csr" \
            -CA "$CI_TLS_DIR/ca.pem" \
            -CAkey "$CI_TLS_DIR/ca-key.pem" \
            -CAcreateserial \
            -out "$CI_TLS_DIR/simple-chat.test.pem" \
            -days 1 -sha256 \
            -extfile "$CI_TLS_DIR/san.cnf"

          {
            echo "CI_TLS_CA_PATH=$CI_TLS_DIR/ca.pem"
            echo "CI_TLS_CERT_PATH=$CI_TLS_DIR/simple-chat.test.pem"
            echo "CI_TLS_KEY_PATH=$CI_TLS_DIR/simple-chat.test-key.pem"
            echo 'CI_NODE_EXTRA_CA_CERTS=/etc/ssl/certs/simple-chat-ci-root-ca.pem'
          } >> "$GITHUB_ENV"

      - name: Resolve CI domains
        run: |
          set -euo pipefail
          printf '%s\n' '127.0.0.1 app.simple-chat.test api.simple-chat.test' | sudo tee -a /etc/hosts
          getent hosts app.simple-chat.test api.simple-chat.test

      - name: Validate resolved Compose TLS mounts
        run: |
          set -euo pipefail
          resolved_config="$RUNNER_TEMP/simple-chat-compose.json"
          docker compose --env-file "$COMPOSE_ENV_FILE" config --format json > "$resolved_config"

          jq -e \
            --arg ca "$CI_TLS_CA_PATH" \
            --arg cert "$CI_TLS_CERT_PATH" \
            --arg key "$CI_TLS_KEY_PATH" \
            '
              ([.services.frontend.volumes[] | select(.target == "/etc/ssl/certs/simple-chat-ci-root-ca.pem")] | length == 1 and .[0].source == $ca)
              and ([.services.nginx.volumes[] | select(.target == "/etc/nginx/ssl/simple-chat.test.pem")] | length == 1 and .[0].source == $cert)
              and ([.services.nginx.volumes[] | select(.target == "/etc/nginx/ssl/simple-chat.test-key.pem")] | length == 1 and .[0].source == $key)
              and ([.services[].volumes[]? | select(.source | contains(".cert/"))] | length == 0)
            ' "$resolved_config"
          jq -c '{frontend: [.services.frontend.volumes[] | select(.target == "/etc/ssl/certs/simple-chat-ci-root-ca.pem")], nginx: [.services.nginx.volumes[] | select(.target | startswith("/etc/nginx/ssl/"))]}' "$resolved_config"

      - name: Build and start full Compose stack
        run: |
          set -euo pipefail
          docker compose --env-file "$COMPOSE_ENV_FILE" build
          docker compose --env-file "$COMPOSE_ENV_FILE" up -d postgres redis
          docker compose --env-file "$COMPOSE_ENV_FILE" run --rm --no-deps --entrypoint composer backend install --no-interaction --prefer-dist
          docker compose --env-file "$COMPOSE_ENV_FILE" up -d backend reverb horizon frontend nginx

      - name: Wait for Compose health
        run: |
          set -euo pipefail

          wait_for_health() {
            local service="$1"
            local deadline=$((SECONDS + 180))
            local container_id
            local health

            while (( SECONDS < deadline )); do
              container_id="$(docker compose --env-file "$COMPOSE_ENV_FILE" ps -q "$service")"
              if [[ -n "$container_id" ]]; then
                health="$(docker inspect -f '{{.State.Health.Status}}' "$container_id")"
                if [[ "$health" == "healthy" ]]; then
                  return 0
                fi
                if [[ "$health" == "unhealthy" ]]; then
                  echo "$service healthcheck failed"
                  return 1
                fi
              fi
              sleep 2
            done

            echo "Timeout waiting for $service health"
            return 1
          }

          wait_for_health postgres
          wait_for_health redis
          wait_for_health reverb

      - name: Wait for Next readiness
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            if docker compose --env-file "$COMPOSE_ENV_FILE" logs frontend 2>&1 | grep -Fq '✓ Ready'; then
              exit 0
            fi
            sleep 2
          done
          echo 'Next non ha raggiunto la readiness ✓ Ready'
          exit 1

      - name: Validate public HTTPS readiness
        run: curl --fail --silent --show-error --cacert "$CI_TLS_CA_PATH" https://app.simple-chat.test:8443/

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, verificato il 2026-09-19
        with:
          # La versione del runner deve coincidere con quella dell'immagine frontend.
          node-version: 24.19.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          corepack install --global pnpm@11.20.0
          pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Compose services before Playwright
        run: |
          set -euo pipefail

          # Il browser deve partire solo mentre l'intero percorso realtime e' ancora disponibile.
          required_services=(postgres redis backend reverb horizon frontend nginx)
          for service in "${required_services[@]}"; do
            container_id="$(docker compose --env-file "$COMPOSE_ENV_FILE" ps -q "$service")"
            if [[ -z "$container_id" ]]; then
              echo "Container assente per $service"
              exit 1
            fi

            status="$(docker inspect -f '{{.State.Status}}' "$container_id")"
            if [[ "$status" != "running" ]]; then
              echo "$service non e' running: $status"
              exit 1
            fi

            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
            if [[ "$health" != "healthy" && "$health" != "none" ]]; then
              echo "$service non e' healthy: $health"
              exit 1
            fi
          done

          docker compose --env-file "$COMPOSE_ENV_FILE" ps

      - name: Run realtime Playwright E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_IGNORE_HTTPS_ERRORS: "true"
        run: pnpm e2e

      - name: Check Reverb cache-table race
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if ! reverb_logs="$(docker compose --env-file "$COMPOSE_ENV_FILE" logs --no-color reverb 2>&1)"; then
            echo '::warning title=Log Reverb non disponibile::Non e stato possibile osservare la race della tabella cache.'
            printf '%s\n' "$reverb_logs"
            exit 0
          fi

          # La race puo' essere recuperata prima del browser: il log la rende visibile anche nei run verdi.
          if grep -Fq 'relation "cache" does not exist' <<< "$reverb_logs"; then
            echo '::warning title=Race Reverb/cache rilevata::Reverb ha interrogato la tabella cache prima del completamento delle migration.'
            grep -F -C 3 'relation "cache" does not exist' <<< "$reverb_logs"
          else
            echo 'Race Reverb/cache non rilevata nei log del servizio.'
          fi

      - name: Collect Compose logs after failure
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          docker compose --env-file "$COMPOSE_ENV_FILE" logs --no-color > "$RUNNER_TEMP/compose.log"
          frontend_container="$(docker compose --env-file "$COMPOSE_ENV_FILE" ps -aq frontend)"
          if [ -n "$frontend_container" ]; then
            docker cp "$frontend_container:/app/.next/dev/trace-turbopack" "$RUNNER_TEMP/trace-turbopack" || true
          fi

      - name: Upload E2E diagnostics after failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, verificato il 2026-09-19
        with:
          name: realtime-compose-e2e-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/compose.log
            ${{ runner.temp }}/trace-turbopack
            frontend/playwright-report

      - name: Tear down CI Compose stack
        if: ${{ always() }}
        run: docker compose --env-file "$COMPOSE_ENV_FILE" down -v --remove-orphans
