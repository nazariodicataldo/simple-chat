services:
  backend:
    environment:
      # La CI deve usare le stesse regole applicative del profilo Compose locale.
      APP_ENV: local
      # I test di autenticazione cifrano i cookie.
      # La chiave fittizia serve solo alla CI e non e' un segreto.
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # Il job prepara il volume vendor prima dell'avvio concorrente dei servizi.
      SKIP_COMPOSER_INSTALL: "true"

  frontend:
    # I controlli CI non chiamano servizi HTTPS: il certificato locale non deve essere richiesto.
    # Webpack evita il crash Turbopack osservato solo nel runner GitHub, senza cambiare lo sviluppo locale.
    command:
      [
        "pnpm",
        "exec",
        "next",
        "dev",
        "--webpack",
        "--hostname",
        "0.0.0.0",
        "--port",
        "3000",
      ]
    environment:
      # Il path interno resta stabile, mentre il job sostituisce il source locale con la CA effimera.
      NODE_EXTRA_CA_CERTS: ${CI_NODE_EXTRA_CA_CERTS:-}
    volumes: !override
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
      - pnpm-cache:/pnpm-cache
      - ${CI_TLS_CA_PATH:-/dev/null}:/etc/ssl/certs/simple-chat-ci-root-ca.pem:ro

  reverb:
    environment:
      # Reverb condivide il profilo Laravel locale per mantenere coerente il bootstrap CI.
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      # Il job prepara il volume vendor prima dell'avvio concorrente dei servizi.
      SKIP_COMPOSER_INSTALL: "true"

  horizon:
    environment:
      # Horizon condivide il profilo Laravel locale per mantenere coerente il bootstrap CI.
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # Il job prepara il volume vendor prima dell'avvio concorrente dei servizi.
      SKIP_COMPOSER_INSTALL: "true"

  nginx:
    # L'override completo evita che i bind mount mkcert del profilo locale restino nel runner.
    volumes: !override
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CI_TLS_CERT_PATH:-/dev/null}:/etc/nginx/ssl/simple-chat.test.pem:ro
      - ${CI_TLS_KEY_PATH:-/dev/null}:/etc/nginx/ssl/simple-chat.test-key.pem:ro
      - ./backend:/var/www/html:ro
