name: simple-chat

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: simple-chat-backend
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: ""
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
      - composer-cache:/tmp/composer-cache
      - backend-storage:/var/www/html/storage
      - backend-bootstrap-cache:/var/www/html/bootstrap/cache

  reverb:
    image: simple-chat-backend
    command: php artisan reverb:start
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: ""
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
      - composer-cache:/tmp/composer-cache
      - backend-storage:/var/www/html/storage
      - backend-bootstrap-cache:/var/www/html/bootstrap/cache
    healthcheck:
      test:
        ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) === false);"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  horizon:
    image: simple-chat-backend
    command: php artisan horizon
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_URL: ""
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: ""
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      reverb:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
      - composer-cache:/tmp/composer-cache
      - backend-storage:/var/www/html/storage
      - backend-bootstrap-cache:/var/www/html/bootstrap/cache

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    environment:
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_BACKEND_URL: http://backend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
      - pnpm-cache:/pnpm-cache

volumes:
  postgres-data:
  backend-vendor:
  composer-cache:
  backend-storage:
  backend-bootstrap-cache:
  frontend-node-modules:
  frontend-next:
  pnpm-cache:
