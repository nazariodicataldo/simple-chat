events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream frontend {
        server frontend:3000;
    }

    upstream reverb {
        server reverb:8080;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Il certificato SAN condiviso consente ai due host pubblici di usare lo stesso ingresso TLS.
    server {
        listen 443 ssl;
        listen 8443 ssl;
        server_name app.simple-chat.test;

        ssl_certificate /etc/nginx/ssl/simple-chat.test.pem;
        ssl_certificate_key /etc/nginx/ssl/simple-chat.test-key.pem;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # Le richieste Pusher/Reverb devono mantenere l'upgrade WebSocket e precedere il fallback Laravel.
    server {
        listen 443 ssl;
        listen 8443 ssl;
        server_name api.simple-chat.test;

        root /var/www/html/public;
        index index.php;

        ssl_certificate /etc/nginx/ssl/simple-chat.test.pem;
        ssl_certificate_key /etc/nginx/ssl/simple-chat.test-key.pem;

        location ~ ^/(app|apps)(/|$) {
            proxy_pass http://reverb;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param HTTP_ACCEPT $http_accept;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_COOKIE $http_cookie;
            fastcgi_param HTTP_ORIGIN $http_origin;
            fastcgi_param HTTP_REFERER $http_referer;
            fastcgi_param HTTP_X_REQUESTED_WITH $http_x_requested_with;
            fastcgi_param HTTP_X_XSRF_TOKEN $http_x_xsrf_token;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
            fastcgi_param HTTP_X_FORWARDED_PORT 8443;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_param HTTPS on;
            fastcgi_param SERVER_PORT 8443;
            fastcgi_pass backend:9000;
        }

        location ~ \.php$ {
            return 404;
        }
    }
}
