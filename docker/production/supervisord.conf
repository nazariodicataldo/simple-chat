[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=app

[program:nginx]
command=/usr/sbin/nginx -c /tmp/production-nginx.conf -g "daemon off;"
directory=/var/www/html
user=app
autostart=true
autorestart=unexpected
startsecs=10
startretries=5
stopsignal=QUIT
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:next]
command=/usr/local/bin/node /opt/next/server.js
directory=/opt/next
environment=HOSTNAME="127.0.0.1",PORT="3000"
user=app
autostart=true
autorestart=unexpected
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
directory=/var/www/html
user=app
autostart=true
autorestart=unexpected
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
command=php artisan horizon
directory=/var/www/html
user=app
autostart=true
autorestart=unexpected
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=65
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
command=php artisan reverb:start
directory=/var/www/html
user=app
autostart=true
autorestart=unexpected
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[eventlistener:essential-process-fatal]
command=/usr/local/bin/production-fatal-listener
events=PROCESS_STATE_FATAL
buffer_size=10
startsecs=0
autostart=true
autorestart=false
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
